# Republica o site uma vez por dia para os cards de planos gravados no HTML
# acompanharem o app (o build roda scripts/vitrine.js). A página já confere os
# preços ao vivo; esta rotina mantém em dia o HTML que o Google lê.
#
# Precisa do secret CF_PAGES_DEPLOY_HOOK no repositório (Cloudflare Pages >
# cafeworking-site > Settings > Builds > Deploy hooks). Sem ele, não faz nada.

name: Republicar vitrine

on:
  schedule:
    - cron: "0 9 * * *" # 6h em Brasília, antes do horário comercial
  workflow_dispatch:

jobs:
  republicar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy hook do Cloudflare Pages
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CF_PAGES_DEPLOY_HOOK não configurado; nada a fazer"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"

<section class="section loja">
  <div class="wrap">
    <div class="eyebrow">Reserva online</div>
    <h1 class="h2">Reserve uma sala de reunião por hora</h1>
    <p class="loja-unidade">Escolha a data, a sala e o horário. O pagamento é por PIX ou cartão e a confirmação chega por e-mail.</p>

    <div class="loja-aviso" id="rs-aviso" role="status" hidden></div>

    <div class="rs-passos" id="rs-app" hidden>
      <div class="form rs-filtros">
        <div class="form-row">
          <label id="rs-unidade-rotulo">Unidade
            <select id="rs-unidade"></select>
          </label>
          <label>Data
            <input type="date" id="rs-data">
          </label>
        </div>
        <p class="loja-seguro" id="rs-janela"></p>
      </div>

      <div id="rs-salas" class="rs-salas" aria-live="polite"></div>

      <div class="loja-grid rs-final" id="rs-final" hidden>
        <aside class="loja-resumo">
          <div class="eyebrow">Sua reserva</div>
          <h2 class="h2" id="rs-resumo-sala"></h2>
          <p class="loja-unidade" id="rs-resumo-quando"></p>
          <div class="loja-total">
            <span>Total</span>
            <strong id="rs-resumo-total"></strong>
            <small id="rs-resumo-detalhe"></small>
          </div>
        </aside>

        <form class="form loja-form" id="rs-form" novalidate>
          <fieldset class="loja-opcoes">
            <legend>Forma de pagamento</legend>
            <div>
              <label class="loja-opcao"><input type="radio" name="forma" value="PIX" checked><span><b>PIX</b><small>Confirmação na hora</small></span></label>
              <label class="loja-opcao"><input type="radio" name="forma" value="CREDIT_CARD"><span><b>Cartão de crédito</b><small>À vista</small></span></label>
            </div>
          </fieldset>
          <label>Nome completo ou razão social
            <input name="nome" autocomplete="name" required maxlength="120">
          </label>
          <div class="form-row">
            <label>CPF ou CNPJ
              <input name="documento" autocomplete="off" required maxlength="18" placeholder="Só números">
            </label>
            <label>Celular (WhatsApp)
              <input name="telefone" type="tel" autocomplete="tel" maxlength="20" placeholder="(31) 90000-0000">
            </label>
          </div>
          <label>E-mail
            <input name="email" type="email" autocomplete="email" required maxlength="120" placeholder="A confirmação chega neste e-mail">
          </label>
          <details class="loja-contrato">
            <summary id="rs-contrato-titulo">Ler o termo de reserva</summary>
            <div class="loja-contrato-texto" id="rs-contrato-texto" tabindex="0"></div>
          </details>
          <label class="loja-aceite">
            <input type="checkbox" name="aceite" required>
            <span id="rs-aceite-texto">Li e aceito o termo de reserva.</span>
          </label>
          <div id="cw-turnstile" class="loja-turnstile"></div>
          <p class="loja-erro" id="rs-erro" role="alert" hidden></p>
          <button class="btn btn-primary" type="submit" id="rs-pagar">Reservar e pagar</button>
          <p class="loja-seguro">O horário fica separado por 30 minutos aguardando o pagamento.</p>
        </form>
      </div>
    </div>
  </div>
</section>
<noscript><section class="section"><div class="wrap"><p>Para reservar online, ative o JavaScript do navegador ou <a href="https://wa.me/5531997129789">fale com a gente pelo WhatsApp</a>.</p></div></section></noscript>

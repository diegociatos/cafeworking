# Site CafeWorking no Cloudflare Pages (conectado ao GitHub, branch main).
#
# Configuração do build no painel do Pages:
#   Build command:  npm run build   (scripts/build-site.js faz a cadeia toda)
#   Output:         dist
#   Variável:       NODE_VERSION = 22
#
# O build grava a vitrine de planos a partir do app, gera as páginas por cidade
# da vitrine nacional (scripts/paginas-cidade.js → /endereco-fiscal/<cidade>-<uf>)
# e monta dist/ só com o que é público (ver scripts/build-dist.js). Funções em
# functions/api/.

name = "cafeworking-site"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"
